# Gold set — évaluation retrieval RAG LexGabon
# 40 questions couvrant les domaines indexés + questions hors-périmètre.
#
# Champs :
#   id               : identifiant unique kebab-case
#   question         : question telle que posée par un utilisateur
#   expected_articles: liste de numéros d'articles attendus dans le top-k
#                      (liste vide = question hors-périmètre, attendre 0 résultat)
#   expected_domain  : domaine déclaré à retriever.search()
#   difficulty       : easy | medium | trap
#
# Domaines indexés : travail, impots, hydrocarbures, douane, marche-public, sante, communication
# Domaines non indexés (hors-périmètre corpus) : civil, penal, commercial, administratif, famille, fonction_publique
#
# Sections :
#   A. Droit du travail      (8 questions)
#   B. Droit fiscal          (5 questions)
#   C. Hydrocarbures         (4 questions)
#   D. Douane                (3 questions)
#   E. Marchés publics       (4 questions)
#   F. Santé                 (4 questions)
#   G. Communication         (4 questions)
#   H. Hors-périmètre corpus (5 questions — expected_articles vide)
#   I. Questions pièges      (3 questions — articles abrogés / hors Gabon)

questions:

  # ── A. Droit du travail ──────────────────────────────────────────────────

  - id: travail-duree-hebdo
    question: Quelle est la durée légale hebdomadaire du travail au Gabon ?
    expected_articles: ["24", "25"]
    expected_domain: travail
    difficulty: easy

  - id: travail-conges-payes
    question: Combien de jours de congé payé un salarié acquiert-il par mois de service ?
    expected_articles: ["149", "150"]
    expected_domain: travail
    difficulty: easy

  - id: travail-preavis-rupture
    question: Quelle est la durée du préavis en cas de rupture du contrat de travail ?
    expected_articles: ["54", "55"]
    expected_domain: travail
    difficulty: easy

  - id: travail-conge-maternite
    question: Quels sont les droits d'une salariée en congé de maternité ?
    expected_articles: ["207", "210"]
    expected_domain: travail
    difficulty: medium

  - id: travail-licenciement-faute
    question: Quelles sont les conditions du licenciement pour faute grave au Gabon ?
    expected_articles: ["50", "51", "52"]
    expected_domain: travail
    difficulty: medium

  - id: travail-greve-conditions
    question: Quelles sont les conditions légales d'exercice du droit de grève au Gabon ?
    expected_articles: ["378", "379", "380"]
    expected_domain: travail
    difficulty: medium

  - id: travail-delegates-personnel
    question: Quel est le rôle des délégués du personnel dans l'entreprise gabonaise ?
    expected_articles: ["64", "66", "68"]
    expected_domain: travail
    difficulty: easy

  - id: travail-salaire-minimum
    question: Comment est fixé le salaire minimum interprofessionnel garanti (SMIG) au Gabon ?
    expected_articles: ["178", "179", "180"]
    expected_domain: travail
    difficulty: medium

  # ── B. Droit fiscal ──────────────────────────────────────────────────────

  - id: fiscal-is-benefice
    question: Comment est déterminé le bénéfice net imposable à l'impôt sur les sociétés au Gabon ?
    expected_articles: ["3", "4", "11"]
    expected_domain: impots
    difficulty: medium

  - id: fiscal-tva-regime
    question: Quel est le régime de la taxe sur la valeur ajoutée applicable au Gabon ?
    expected_articles: ["223", "224", "225"]
    expected_domain: impots
    difficulty: medium

  - id: fiscal-retenue-salaires
