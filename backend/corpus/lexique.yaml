# Lexique juridique LexGabon — vocabulaire de gating.
#
# Ce fichier est ÉDITABLE À LA MAIN par un juriste. Il pilote la décision de
# couverture : ce que le corpus indexé sait traiter, et ce qu'il ne sait pas.
#
# Trois blocs :
#   domaines            — vocabulaire POSITIF des 7 codes indexés. Amorcé par
#                         scripts/bootstrap_lexique.py, complété d'alias métier.
#                         Un terme en trop ici est bénin (il fait chercher).
#   domaines_non_indexes— lexique NÉGATIF : marqueurs FORTS des matières absentes
#                         du corpus. ATTENTION : un terme trop générique ici fait
#                         REFUSER une question légitime. N'y mettre jamais un mot
#                         du vocabulaire juridique commun (« contrat », « obligation »).
#   codes / juridictions— textes nommément invoqués et juridictions étrangères.
#
# CEMAC n'est pas listé dans regionaux_non_indexes : le Code des douanes CEMAC
# EST indexé.
