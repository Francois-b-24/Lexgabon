[project]
name = "lexgabon-legal-agent"
version = "0.1.0"
description = "FastAPI legal chatbot backend (cahier des charges LexGabon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "anthropic>=0.40.0",
  "chromadb>=0.5.0",
  "redis>=5.2.0",
  "python-dotenv>=1.0.0",
  "sentence-transformers>=3.0.0",
  "pypdf>=5.0.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
